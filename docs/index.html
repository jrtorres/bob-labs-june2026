<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IBM Bob Workshop</title>

  <!-- IBM Plex Sans & Mono fonts -->
  <link rel="stylesheet" href="https://1.www.s81c.com/common/carbon/plex/sans.css" />
  <link rel="stylesheet" href="https://1.www.s81c.com/common/carbon/plex/mono.css" />

  <!-- IBM Carbon Design System -->
  <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css" />

  <!-- highlight.js — theme swapped by site.js on theme toggle -->
  <link id="hljs-theme" rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />

  <!-- Site styles -->
  <link rel="stylesheet" href="site.css" />
</head>

<body data-theme="dark">

  <!-- ═══════════════════════════════════════════
       HEADER — always dark, IBM CE branding
  ═══════════════════════════════════════════ -->
  <header class="site-header" id="header" role="banner">
    <div class="header-left">
      <!-- Hamburger — mobile only -->
      <button class="hamburger" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <span class="header-brand">IBM Client Engineering</span>
      <span class="header-divider" aria-hidden="true">|</span>
      <span class="header-title">IBM Bob Workshop</span>
    </div>

    <nav class="header-right" aria-label="Header actions">
      <!-- Header nav links (Prerequisites, etc.) populated by site.js -->
      <div id="header-links"></div>

      <!-- Resources dropdown -->
      <div class="resources-dropdown" id="resources-dropdown">
        <button class="header-action-btn" id="resources-btn"
                aria-haspopup="true" aria-expanded="false">
          Resources <span class="dropdown-caret" aria-hidden="true">▾</span>
        </button>
        <ul class="dropdown-menu" id="resources-menu" role="menu" aria-label="Resources">
          <!-- populated by site.js -->
        </ul>
      </div>

      <!-- Light / Dark theme toggle -->
      <button class="header-action-btn theme-toggle" id="theme-toggle"
              aria-label="Toggle light/dark theme" title="Toggle theme">
        <span id="theme-icon">☀</span>
      </button>
    </nav>
  </header>

  <!-- ═══════════════════════════════════════════
       LIGHTBOX
  ═══════════════════════════════════════════ -->
  <div id="lightbox" aria-hidden="true" aria-modal="true" role="dialog" aria-label="Image preview">
    <button id="lightbox-close" aria-label="Close image preview">✕</button>
    <img id="lightbox-img" src="" alt="" />
  </div>

  <!-- ═══════════════════════════════════════════
       SHELL — side nav + content
  ═══════════════════════════════════════════ -->
  <div class="shell" id="shell">

    <!-- Side navigation -->
    <nav class="side-nav" id="side-nav" aria-label="Lab navigation">
      <!-- populated by site.js from nav.json -->
    </nav>

    <!-- Overlay for mobile nav -->
    <div class="nav-overlay" id="nav-overlay" aria-hidden="true"></div>

    <!-- Main content area -->
    <main class="content-area" id="content" tabindex="-1">
      <!-- markdown rendered here by site.js -->
      <div class="loading" id="loading-state" aria-live="polite">
        <div class="skeleton skeleton-h1"></div>
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-text short"></div>
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-block"></div>
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-text short"></div>
      </div>
    </main>
  </div>

  <!-- ═══════════════════════════════════════════
       CDN SCRIPTS (loaded before site.js)
  ═══════════════════════════════════════════ -->
  <!-- marked.js — markdown → HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>

  <!-- highlight.js — syntax highlighting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- mermaid.js — diagram rendering -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <!-- Site logic -->
  <script src="site.js"></script>
</body>
</html>
